name: Budowa i Wdrożenie Gryf

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalacja zależności
        run: npm ci

      - name: Weryfikacja typów TypeScript i budowanie
        run: npm run build

      - name: Weryfikacja obecności workerów DSP
        run: |
          test -f dist/workers/guitarWorklet.js || exit 1
          test -f dist/workers/sfxWorker.js || exit 1
          echo "Wszystkie moduły DSP i workery obecne w dist!"

      - name: Przygotowanie artefaktów GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Wdrożenie na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
