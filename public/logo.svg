<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220">
  <defs>
    <!-- Filters -->
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="logo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#e0392b" flood-opacity="0.3" />
    </filter>

    <filter id="text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
      <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#e2b04a" flood-opacity="0.35" />
    </filter>

    <!-- Gradients -->
    <radialGradient id="logo-bg-radial" cx="20%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c140e" />
      <stop offset="45%" stop-color="#100d0a" />
      <stop offset="100%" stop-color="#0b0907" />
    </radialGradient>

    <radialGradient id="crest-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0392b" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#e2b04a" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0b0907" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="emblem-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7" />
      <stop offset="25%" stop-color="#e2b04a" />
      <stop offset="65%" stop-color="#e0392b" />
      <stop offset="90%" stop-color="#881337" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="text-cream-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f5eee0" />
      <stop offset="70%" stop-color="#e2b04a" />
      <stop offset="100%" stop-color="#9a5808" />
    </linearGradient>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0392b" stop-opacity="0" />
      <stop offset="15%" stop-color="#e0392b" />
      <stop offset="35%" stop-color="#e2b04a" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="85%" stop-color="#58c46c" />
      <stop offset="100%" stop-color="#58c46c" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#e0392b" />
    </linearGradient>

    <linearGradient id="gold-facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6db" />
      <stop offset="50%" stop-color="#e2b04a" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="gold-facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <linearGradient id="crimson-facet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b6b" />
      <stop offset="60%" stop-color="#e0392b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Clip path for emblem guitar neck -->
    <clipPath id="emblem-pick-clip">
      <path d="M 105, 26 C 158, 26 200, 48 200, 105 C 200, 156 156, 202 110, 214 C 107, 215 103, 215 100, 214 C 54, 202 10, 156 10, 105 C 10, 48 52, 26 105, 26 Z" />
    </clipPath>
  </defs>

  <!-- Canvas Background -->
  <rect width="860" height="220" rx="16" fill="url(#logo-bg-radial)" />
  <rect width="858" height="218" x="1" y="1" rx="15" fill="none" stroke="#241e18" stroke-width="1.5" />

  <!-- Background Ambient Stage Glow behind Emblem -->
  <circle cx="105" cy="110" r="110" fill="url(#crest-glow)" />

  <!-- ==================== LEFT: THE GRYF HERALDIC EMBLEM ==================== -->
  <g transform="translate(10, 0)">
    <!-- Pick Outer Body with Drop Shadow -->
    <g filter="url(#logo-shadow)">
      <path
        d="M 105, 24 C 160, 24 202, 48 202, 105 C 202, 158 156, 204 110, 216 C 107, 217 103, 217 100, 216 C 54, 204 8, 158 8, 105 C 8, 48 50, 24 105, 24 Z"
        fill="#120e0b"
        stroke="url(#emblem-rim)"
        stroke-width="5"
        stroke-linejoin="round"
      />
      <!-- Inset filament line -->
      <path
        d="M 105, 32 C 152, 32 192, 53 192, 105 C 192, 152 150, 194 109, 206 C 106, 207 104, 207 101, 206 C 60, 194 18, 152 18, 105 C 18, 53 58, 32 105, 32 Z"
        fill="none"
        stroke="#f2ead8"
        stroke-opacity="0.25"
        stroke-width="1.2"
      />
    </g>

    <!-- Fretboard & Strings (Clipped inside Pick) -->
    <g clip-path="url(#emblem-pick-clip)">
      <!-- Ebony neck slab -->
      <polygon points="76,35 134,35 146,215 64,215" fill="#18130f" />
      <line x1="76" y1="35" x2="64" y2="215" stroke="#f2ead8" stroke-width="1.5" stroke-opacity="0.3" />
      <line x1="134" y1="35" x2="146" y2="215" stroke="#f2ead8" stroke-width="1.5" stroke-opacity="0.3" />

      <!-- Fret Wires -->
      <line x1="74" y1="62" x2="136" y2="62" stroke="#f2ead8" stroke-width="1.8" stroke-opacity="0.75" />
      <line x1="72" y1="95" x2="138" y2="95" stroke="#f2ead8" stroke-width="2.0" stroke-opacity="0.75" />
      <line x1="70" y1="134" x2="140" y2="134" stroke="#f2ead8" stroke-width="2.2" stroke-opacity="0.75" />
      <line x1="67" y1="178" x2="143" y2="178" stroke="#f2ead8" stroke-width="2.5" stroke-opacity="0.75" />

      <!-- Pearl Diamond inlays -->
      <polygon points="105,110 109,114.5 105,119 101,114.5" fill="#f2ead8" opacity="0.8" />
      <polygon points="95,195 98,198 95,201 92,198" fill="#f2ead8" opacity="0.8" />
      <polygon points="115,195 118,198 115,201 112,198" fill="#f2ead8" opacity="0.8" />

      <!-- 6 Rocksmith Neon Strings with Glow -->
      <!-- 6: Low E (Crimson) -->
      <line x1="82" y1="30" x2="72" y2="215" stroke="#e0392b" stroke-width="3.6" filter="url(#logo-glow)" />
      <line x1="82" y1="30" x2="72" y2="215" stroke="#ffb4aa" stroke-width="0.8" />
      <!-- 5: A (Goldenrod Amber) -->
      <line x1="91" y1="30" x2="85" y2="215" stroke="#eab308" stroke-width="3.2" filter="url(#logo-glow)" />
      <line x1="91" y1="30" x2="85" y2="215" stroke="#fef9c3" stroke-width="0.7" />
      <!-- 4: D (Electric Azure / Cyan) -->
      <line x1="100" y1="30" x2="98" y2="215" stroke="#38bdf8" stroke-width="2.8" filter="url(#logo-glow)" />
      <line x1="100" y1="30" x2="98" y2="215" stroke="#ffffff" stroke-width="0.6" />
      <!-- 3: G (Molten Sunset Orange) -->
      <line x1="110" y1="30" x2="112" y2="215" stroke="#f97316" stroke-width="2.5" filter="url(#logo-glow)" />
      <line x1="110" y1="30" x2="112" y2="215" stroke="#ffedd5" stroke-width="0.6" />
      <!-- 2: B (Neon Emerald) -->
      <line x1="119" y1="30" x2="125" y2="215" stroke="#22c55e" stroke-width="2.2" filter="url(#logo-glow)" />
      <line x1="119" y1="30" x2="125" y2="215" stroke="#dcfce7" stroke-width="0.5" />
      <!-- 1: High e (Violet Laser) -->
      <line x1="128" y1="30" x2="138" y2="215" stroke="#a855f7" stroke-width="1.8" filter="url(#logo-glow)" />
      <line x1="128" y1="30" x2="138" y2="215" stroke="#f3e8ff" stroke-width="0.5" />
    </g>

    <!-- Griffin Crest Feather Wings at Top -->
    <path d="M 105, 36 C 124, 30 148, 38 162, 54 C 145, 57 128, 55 116, 51 Z" fill="url(#crimson-facet)" />
    <path d="M 105, 36 C 86, 30 62, 38 48, 54 C 65, 57 82, 55 94, 51 Z" fill="url(#crimson-facet)" />
    <polygon points="105,32 114,48 105,58 96,48" fill="url(#gold-facet-light)" />

    <!-- Griffin Claws Gripping Fretboard -->
    <!-- Talon 1 (Top) -->
    <path d="M 166, 92 C 148, 86 132, 85 118, 90 L 119, 98 C 131, 95 144, 96 160, 102 Z" fill="url(#gold-facet-light)" />
    <path d="M 118, 90 C 104, 91 94, 98 88, 106 C 94, 107 103, 105 112, 100 Z" fill="url(#crimson-facet)" />
    <path d="M 90, 105 C 84, 108 80, 114 77, 119 C 81, 116 89, 112 94, 108 Z" fill="#ffffff" filter="url(#logo-glow)" />

    <!-- Talon 2 (Center Main Claw) -->
    <path d="M 172, 120 C 150, 116 130, 118 110, 126 L 112, 136 C 128, 129 146, 127 166, 131 Z" fill="url(#gold-facet-light)" />
    <path d="M 110, 126 C 92, 128 78, 138 70, 149 C 78, 150 90, 147 100, 142 Z" fill="url(#crimson-facet)" />
    <path d="M 72, 147 C 65, 153 58, 160 54, 167 C 60, 162 72, 154 78, 149 Z" fill="#ffffff" filter="url(#logo-glow)" />

    <!-- Talon 3 (Bottom) -->
    <path d="M 164, 145 C 146, 152 130, 162 112, 175 L 115, 184 C 130, 172 144, 164 162, 157 Z" fill="url(#gold-facet-light)" />
    <path d="M 112, 175 C 98, 183 87, 195 82, 206 C 88, 204 98, 198 106, 191 Z" fill="url(#crimson-facet)" />

    <!-- Electric Lightning Bolt Across Pick -->
    <polygon
      points="55,50 96,102 84,105 118,154 104,157 142,212 130,174 140,170 108,124 120,121 86,70"
      fill="url(#bolt-grad)"
      filter="url(#logo-glow)"
    />
    <polyline points="57,53 95,100 85,104 117,152 105,156 140,210" fill="none" stroke="#ffffff" stroke-width="1.2" />

    <!-- Hit Gem / Spark on D-string -->
    <rect x="94" y="128" width="16" height="10" rx="2.5" fill="#38bdf8" filter="url(#logo-glow)" />
    <rect x="95.5" y="129.5" width="13" height="7" rx="1.5" fill="#ffffff" />
    <text x="102" y="136" font-family="'Big Shoulders Display', 'Oswald', sans-serif" font-size="8" font-weight="900" fill="#0b0907" text-anchor="middle">3</text>

    <!-- Starburst Hit Spark -->
    <path d="M 68,145 Q 73,147 78,147 Q 73,147 73,152 Q 73,147 68,147 Q 73,147 73,142 Q 73,147 68,145 Z" fill="#38bdf8" />
    <circle cx="73" cy="147" r="1.5" fill="#ffffff" />
  </g>

  <!-- ==================== RIGHT: SCULPTED VECTOR TYPOGRAPHY ==================== -->
  <g transform="translate(240, 0)" filter="url(#text-shadow)">
    <!-- Letterforms "GRYF" -->
    <g fill="url(#text-cream-gold)">
      <!-- G -->
      <path d="M 22,46 L 76,46 L 85,55 L 85,72 L 67,72 L 67,64 L 33,64 L 28,69 L 28,121 L 33,126 L 73,126 L 73,100 L 55,100 L 55,83 L 85,83 L 85,133 L 76,142 L 22,142 L 8,128 L 8,60 Z" />
      
      <!-- R -->
      <path fill-rule="evenodd" d="M 102,46 L 158,46 C 170,46 176,53 176,68 C 176,82 168,91 154,94 L 174,142 L 153,142 L 137,97 L 121,97 L 121,142 L 102,142 Z M 121,63 L 151,63 C 156,63 158,66 158,71 C 158,76 156,79 151,79 L 121,79 Z" />

      <!-- Y -->
      <path d="M 190,46 L 211,46 L 228,87 L 245,46 L 266,46 L 238,99 L 238,142 L 218,142 L 218,99 Z" />

      <!-- F -->
      <path d="M 282,46 L 345,46 L 338,63 L 302,63 L 302,84 L 332,84 L 327,101 L 302,101 L 302,142 L 282,142 Z" />
    </g>

    <!-- Top Highlight Lines on Letters for 3D Chiseled Look -->
    <g stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.75">
      <line x1="24" y1="47" x2="74" y2="47" />
      <line x1="104" y1="47" x2="156" y2="47" />
      <line x1="192" y1="47" x2="209" y2="47" />
      <line x1="247" y1="47" x2="264" y2="47" />
      <line x1="284" y1="47" x2="343" y2="47" />
    </g>

    <!-- Badges beside Wordmark -->
    <g transform="translate(365, 52)">
      <!-- Badge: OPEN SOURCE -->
      <rect x="0" y="0" width="86" height="22" rx="4" fill="#e0392b" fill-opacity="0.18" stroke="#e0392b" stroke-width="1.4" />
      <text x="43" y="15" font-family="'Barlow Condensed', 'Oswald', sans-serif" font-size="11" font-weight="800" fill="#e0392b" letter-spacing="0.14em" text-anchor="middle">OPEN WEB</text>

      <!-- Badge: AI PRO -->
      <rect x="94" y="0" width="94" height="22" rx="4" fill="#e2b04a" fill-opacity="0.16" stroke="#e2b04a" stroke-width="1.4" />
      <text x="141" y="15" font-family="'Barlow Condensed', 'Oswald', sans-serif" font-size="11" font-weight="800" fill="#e2b04a" letter-spacing="0.14em" text-anchor="middle">AI AUDIO-TAB</text>
    </g>

    <!-- Real-Time Audio Oscilloscope Filament Divider -->
    <g transform="translate(8, 155)">
      <!-- Baseline Filament -->
      <line x1="0" y1="0" x2="575" y2="0" stroke="#f2ead8" stroke-opacity="0.16" stroke-width="1" />
      <!-- Pulsing Waveform -->
      <path
        d="M 0,0 L 70,0 Q 85,-3 95,2 Q 105,7 115,-8 Q 125,-22 135,16 Q 145,-14 155,20 Q 165,-28 175,24 Q 185,-18 195,14 Q 205,-8 215,6 Q 225,-2 235,0 L 575,0"
        fill="none"
        stroke="url(#wave-grad)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#logo-glow)"
      />
    </g>

    <!-- Subtitle: "OPEN ROCKSMITH+ FOR WEB" -->
    <g transform="translate(8, 180)">
      <text
        x="0"
        y="0"
        font-family="'Barlow Condensed', 'Oswald', sans-serif"
        font-size="19"
        font-weight="900"
        fill="#e2b04a"
        letter-spacing="0.22em"
      >
        OPEN ROCKSMITH+ FOR WEB
      </text>
    </g>

    <!-- Secondary Spec Line -->
    <g transform="translate(8, 199)">
      <text
        x="0"
        y="0"
        font-family="'Barlow', system-ui, sans-serif"
        font-size="11.5"
        font-weight="600"
        fill="#f2ead8"
        fill-opacity="0.65"
        letter-spacing="0.16em"
      >
        REAL-TIME 3D NOTE HIGHWAY  •  ZERO-LATENCY DSP  •  STEM SEPARATION
      </text>
    </g>
  </g>
</svg>